[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "QRTlib"
dynamic = ["version"]
description = "Fast quantum real transforms for Qiskit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Armin Ahmadkhaniha" },
  { name = "Lu Chen" },
  { name = "Jake Doliskani" },
  { name = "Zhifu Sun" },
]
keywords = [
  "quantum computing",
  "qiskit",
  "hartley transform",
  "cosine transform",
  "sine transform",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy==2.2.6",
  "qiskit==2.0.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.9",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/jake-doliskani/QRTlib"
Repository = "https://github.com/jake-doliskani/QRTlib.git"
Issues = "https://github.com/jake-doliskani/QRTlib/issues"
Paper = "https://arxiv.org/abs/2510.16625"

[tool.hatch.version]
path = "src/qrtlib/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qrtlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Preserve the upstream implementation unchanged during the packaging-only phase.
# These existing categories can be enabled incrementally in later cleanup work.
ignore = ["E402", "E712", "F401", "F403", "F405", "F811"]
